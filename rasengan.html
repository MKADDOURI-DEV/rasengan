<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rasengan</title>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>

  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: system-ui, sans-serif; }

    .layer {
      position: fixed; inset: 0;
      width: 100vw; height: 100vh;
      object-fit: cover;
      transform: scaleX(-1);
    }
    #cam      { z-index: 0; }
    #skeleton { z-index: 2; pointer-events: none; }
    #fx       { z-index: 11; pointer-events: none; }

    .vignette {
      position: fixed; inset: 0;
      background: radial-gradient(ellipse at center, transparent 35%, rgba(0,0,0,0.55) 100%);
      pointer-events: none; z-index: 4;
    }

    .rasengan {
      position: fixed; top: 0; left: 0;
      width: 1500px; height: auto;
      transform: translate(-50%, -50%);
      pointer-events: none;
      mix-blend-mode: screen;
      opacity: 0;
      will-change: opacity, left, top;
      z-index: 10;
    }

    #hint {
      position: fixed; bottom: 16px; left: 50%;
      transform: translateX(-50%);
      color: #cfe9ff; font-size: 14px; letter-spacing: 0.04em;
      background: rgba(0,0,0,0.45);
      padding: 6px 12px; border-radius: 999px;
      z-index: 12; pointer-events: none;
    }
  </style>
</head>
<body>
  <video  id="cam"      class="layer" autoplay playsinline muted></video>
  <canvas id="skeleton" class="layer"></canvas>
  <div    class="vignette"></div>
  <canvas id="fx"       class="layer"></canvas>
  <div    id="hint"></div>

  <video class="rasengan" data-slot="0" src="assets/rasengan.mp4" muted autoplay loop playsinline preload="auto"></video>
  <video class="rasengan" data-slot="1" src="assets/rasengan.mp4" muted autoplay loop playsinline preload="auto"></video>

  <script>
    const camVideo = document.getElementById('cam');
    const canvas   = document.getElementById('skeleton');
    const pen      = canvas.getContext('2d');
    const orbs     = Array.from(document.querySelectorAll('.rasengan'));
    const fx       = document.getElementById('fx');
    const fxPen    = fx.getContext('2d');
    const hint     = document.getElementById('hint');
    const HINT_DEFAULT = '🖐️ main ouverte = Rasengan  ·  🤝 une main tient le poignet de l\'autre = Chidori  ·  🙌 deux mains collées = Kamehameha';
    hint.textContent = HINT_DEFAULT;

    // Two distinct palettes so each hand's skeleton is obviously different,
    // and bones vs joints inside one hand are also different colors.
    const PALETTES = {
      Left:  { bone: '#ff8a3d', joint: '#fff36a', glow: '#ff5e1a' }, // warm — Naruto orange
      Right: { bone: '#62f0ff', joint: '#ff66e0', glow: '#1aa6ff' }  // cool — chakra blue
    };

    // Per-hand fade-in / fade-out state for the orbs.
    const orbState = [
      { charge: 0, wasOpen: false },
      { charge: 0, wasOpen: false }
    ];


    // ---- combo-start ----------------------------------------------------
    // Seuils (en multiples de la taille de la main) — modifiables.
    const CFG = {
      chidoriGrab:  1.00, // paume de la main A <-> poignet de la main B
      chidoriApart: 0.45, // poignet A <-> poignet B (sinon c'est un Kamehameha)
      kameWrists:   1.10, // poignet <-> poignet
      kamePalms:    2.00, // paume <-> paume (mains en coupe = paumes écartées)
      kameFireDelay: 0.5, // secondes de charge à fond avant que le rayon parte
      comboGrace:   12    // images pendant lesquelles on garde le combo si une main disparaît
    };

    const clamp01 = v => Math.max(0, Math.min(1, v));
    const px   = (lm, i) => ({ x: lm[i].x * canvas.width, y: lm[i].y * canvas.height });
    const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

    // Retourne { type:'chidori', held, hs } | { type:'kame', A, B, hs } | null
    function detectCombo(hands) {
      if (!hands || hands.length < 2) return null;
      const [A, B] = hands;
      const hs = (dist(px(A, 0), px(A, 9)) + dist(px(B, 0), px(B, 9))) / 2;
      if (hs < 1) return null;

      // Chidori: la paume d'une main tient le poignet de l'autre
      for (const [holder, held] of [[A, B], [B, A]]) {
        const grab  = dist(px(holder, 9), px(held, 0)) < hs * CFG.chidoriGrab;
        const apart = dist(px(holder, 0), px(held, 0)) > hs * CFG.chidoriApart;
        if (grab && apart) return { type: 'chidori', held, hs };
      }

      // Kamehameha: les deux mains sont collées l'une à l'autre
      const wr = dist(px(A, 0), px(B, 0)) < hs * CFG.kameWrists;
      const pm = dist(px(A, 9), px(B, 9)) < hs * CFG.kamePalms;
      if (wr && pm) return { type: 'kame', A, B, hs };

      return null;
    }
    // ---- combo-end ------------------------------------------------------

    const FINGER_TIPS     = [8, 12, 16, 20];
    const FINGER_KNUCKLES = [6, 10, 14, 18];

    function isPalmOpen(lm) {
      const wrist = lm[0];
      let extended = 0;
      for (let i = 0; i < FINGER_TIPS.length; i++) {
        const tip = lm[FINGER_TIPS[i]];
        const knk = lm[FINGER_KNUCKLES[i]];
        const dTip = Math.hypot(tip.x - wrist.x, tip.y - wrist.y);
        const dKnk = Math.hypot(knk.x - wrist.x, knk.y - wrist.y);
        if (dTip > dKnk) extended++;
      }
      return extended >= 3;
    }

    // Draw bones in one color, joints in another, with a colored glow,
    // so the tracking sticks visibly follow each finger.
    function paintSkeleton(lm, colors) {
      pen.save();
      pen.shadowBlur  = 18;
      pen.shadowColor = colors.glow;
      drawConnectors(pen, lm, HAND_CONNECTIONS, { color: colors.bone, lineWidth: 3 });
      pen.restore();

      pen.save();
      pen.shadowBlur  = 10;
      pen.shadowColor = colors.glow;
      pen.fillStyle   = colors.joint;
      for (const p of lm) {
        pen.beginPath();
        pen.arc(p.x * canvas.width, p.y * canvas.height, 3.5, 0, Math.PI * 2);
        pen.fill();
      }
      pen.restore();
    }

    function placeOrb(slot, lm, charge) {
      const wrist  = lm[0];
      const midKnk = lm[9];

      const cx = (wrist.x + midKnk.x) / 2;
      const cy = (wrist.y + midKnk.y) / 2;
      const handSize = Math.hypot(midKnk.x - wrist.x, midKnk.y - wrist.y);
      const lift = handSize * 1.8;

      const orb = orbs[slot];
      orb.style.left    = `${(1 - cx) * window.innerWidth}px`;
      orb.style.top     = `${(cy - lift) * window.innerHeight}px`;
      orb.style.opacity = charge.toFixed(3);
    }


    // ---------- Effets Chidori / Kamehameha (dessinés en code, sans vidéo) ----------
    const fxState = {
      chidori: { amt: 0, pos: null, hs: 0 },
      kame:    { amt: 0, pos: null, hs: 0, dir: { x: 1, y: 0 }, fire: 0, beam: 0 }
    };

    function updateCombo(combo, fresh = true) {
      const c = fxState.chidori, k = fxState.kame;
      c.amt = clamp01(c.amt + (combo && combo.type === 'chidori' ? 0.12 : -0.08));
      k.amt = clamp01(k.amt + (combo && combo.type === 'kame'    ? 0.07 : -0.06));

      if (fresh && combo && combo.type === 'chidori') {
        const w = px(combo.held, 0), m = px(combo.held, 9);
        c.pos = { x: m.x + (m.x - w.x) * 0.5, y: m.y + (m.y - w.y) * 0.5 };
        c.hs  = combo.hs;
      }

      if (fresh && combo && combo.type === 'kame') {
        const { A, B } = combo;
        const a9 = px(A, 9), b9 = px(B, 9);
        k.pos = { x: (a9.x + b9.x) / 2, y: (a9.y + b9.y) / 2 };
        k.hs  = combo.hs;

        // Direction du rayon = là où pointent les doigts (poignet -> paume)
        const a0 = px(A, 0), b0 = px(B, 0);
        let dx = (a9.x - a0.x) + (b9.x - b0.x);
        let dy = (a9.y - a0.y) + (b9.y - b0.y);
        let len = Math.hypot(dx, dy);
        if (len < combo.hs * 0.8) {          // mains pointées vers la caméra -> rayon horizontal
          dx = k.pos.x < canvas.width / 2 ? 1 : -1; dy = 0; len = 1;
        }
        dx /= len; dy /= len;
        k.dir.x += (dx - k.dir.x) * 0.3;
        k.dir.y += (dy - k.dir.y) * 0.3;
        const n = Math.hypot(k.dir.x, k.dir.y) || 1;
        k.dir.x /= n; k.dir.y /= n;
      }

      hint.textContent = combo
        ? (combo.type === 'chidori' ? '⚡ CHIDORI !' : '🌊 KA-ME-HA-ME-HAAA !')
        : HINT_DEFAULT;
    }

    function jaggedPath(x, y, angle, len, segs = 9) {
      const pts = [{ x, y }];
      let cx = x, cy = y;
      for (let i = 0; i < segs; i++) {
        const a = angle + (Math.random() - 0.5) * 1.0;
        cx += Math.cos(a) * len / segs;
        cy += Math.sin(a) * len / segs;
        pts.push({ x: cx, y: cy });
      }
      return pts;
    }
    function strokePts(ctx, pts) {
      ctx.beginPath();
      ctx.moveTo(pts[0].x, pts[0].y);
      for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
      ctx.stroke();
    }

    function drawChidori(ctx, c) {
      const { x, y } = c.pos, r = c.hs * 0.75 * c.amt;
      const g = ctx.createRadialGradient(x, y, 0, x, y, r * 1.8);
      g.addColorStop(0,   'rgba(255,255,255,0.95)');
      g.addColorStop(0.3, 'rgba(150,215,255,0.75)');
      g.addColorStop(1,   'rgba(40,90,255,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(x, y, r * 1.8, 0, Math.PI * 2); ctx.fill();

      ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      for (let i = 0; i < 10; i++) {
        const pts = jaggedPath(x, y, Math.random() * Math.PI * 2,
                               c.hs * (0.9 + Math.random() * 1.5) * c.amt);
        ctx.shadowBlur = 25; ctx.shadowColor = '#4aa8ff';
        ctx.strokeStyle = 'rgba(110,185,255,0.55)'; ctx.lineWidth = 6; strokePts(ctx, pts);
        ctx.shadowBlur = 0;
        ctx.strokeStyle = 'rgba(255,255,255,0.95)'; ctx.lineWidth = 2; strokePts(ctx, pts);
      }
    }

    function drawKame(ctx, k, t) {
      const { x, y } = k.pos;
      const r = k.hs * (0.45 + 0.8 * k.amt) * (1 + 0.06 * Math.sin(t * 18));

      // anneaux d'énergie qui convergent vers la boule
      for (let i = 0; i < 3; i++) {
        const ph = (t * 0.9 + i / 3) % 1;
        ctx.strokeStyle = `rgba(140,220,255,${((1 - ph) * 0.5 * k.amt).toFixed(3)})`;
        ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(x, y, r * (2.8 - 1.9 * ph), 0, Math.PI * 2); ctx.stroke();
      }

      // le rayon
      if (k.beam > 0.01) {
        const len = Math.hypot(canvas.width, canvas.height) * 1.2 * k.beam;
        const ex = x + k.dir.x * len, ey = y + k.dir.y * len;
        const w  = k.hs * (0.9 + 0.2 * Math.sin(t * 25)) * Math.min(1, k.beam * 1.5);
        ctx.lineCap = 'round';
        ctx.shadowBlur = 45; ctx.shadowColor = '#2aa0ff';
        ctx.strokeStyle = 'rgba(60,160,255,0.45)';  ctx.lineWidth = w * 1.8;
        ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(ex, ey); ctx.stroke();
        ctx.strokeStyle = 'rgba(150,230,255,0.85)'; ctx.lineWidth = w;
        ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(ex, ey); ctx.stroke();
        ctx.shadowBlur = 0;
        ctx.strokeStyle = 'rgba(255,255,255,0.95)'; ctx.lineWidth = w * 0.45;
        ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(ex, ey); ctx.stroke();
      }

      // la boule
      const g = ctx.createRadialGradient(x, y, 0, x, y, r * 1.6);
      g.addColorStop(0,    'rgba(255,255,255,1)');
      g.addColorStop(0.35, 'rgba(160,235,255,0.9)');
      g.addColorStop(1,    'rgba(0,120,255,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(x, y, r * 1.6, 0, Math.PI * 2); ctx.fill();
    }

    let lastT = performance.now();
    function fxLoop(now) {
      const dt = Math.min(0.1, (now - lastT) / 1000);
      lastT = now;
      const t = now / 1000;

      if (fx.width !== canvas.width || fx.height !== canvas.height) {
        fx.width = canvas.width; fx.height = canvas.height;
      }
      fxPen.clearRect(0, 0, fx.width, fx.height);

      const c = fxState.chidori, k = fxState.kame;

      // le rayon part après quelques instants de charge à fond
      if (k.amt >= 1) k.fire += dt; else k.fire = 0;
      const beamTarget = k.fire > CFG.kameFireDelay ? 1 : 0;
      k.beam += (beamTarget - k.beam) * (beamTarget ? 0.25 : 0.4);

      fxPen.save();
      fxPen.globalCompositeOperation = 'lighter';
      if (c.amt > 0.01 && c.pos) drawChidori(fxPen, c);
      if (k.amt > 0.01 && k.pos) drawKame(fxPen, k, t);
      fxPen.restore();

      requestAnimationFrame(fxLoop);
    }
    requestAnimationFrame(fxLoop);

    // Une main = un emplacement de rasengan. Avec deux mains on se base sur la
    // position (gauche/droite dans l'image) car MediaPipe donne parfois le même
    // label "Left"/"Right" aux deux mains.
    function assignSlots(lms, labels) {
      const slots = lms.map((_, i) => (labels[i] && labels[i].label === 'Right') ? 1 : 0);
      if (lms.length === 2) {
        const first = lms[0][0].x <= lms[1][0].x ? 0 : 1;
        slots[first] = 0;
        slots[1 - first] = 1;
      }
      return slots;
    }

    let comboHold = null;

    function onResults(res) {
      canvas.width  = camVideo.videoWidth  || canvas.clientWidth;
      canvas.height = camVideo.videoHeight || canvas.clientHeight;
      pen.clearRect(0, 0, canvas.width, canvas.height);

      const lms    = res.multiHandLandmarks || [];
      const labels = res.multiHandedness    || [];
      const slots  = assignSlots(lms, labels);
      let combo = detectCombo(lms);
      let fresh = true;
      if (combo) {
        comboHold = { combo, frames: CFG.comboGrace };
      } else if (comboHold && comboHold.frames > 0 && lms.length < 2) {
        // MediaPipe perd souvent une main quand elles se chevauchent :
        // on garde le combo quelques images au lieu de le couper.
        comboHold.frames--;
        combo = comboHold.combo;
        fresh = false;
      } else {
        comboHold = null;
      }
      updateCombo(combo, fresh);

      const seen = [false, false];

      lms.forEach((lm, i) => {
        const slot   = slots[i];
        const colors = PALETTES[slot === 1 ? 'Right' : 'Left'];
        seen[slot]   = true;

        paintSkeleton(lm, colors);

        // pendant un Chidori / Kamehameha, pas de Rasengan
        const open = !combo && isPalmOpen(lm);
        const st   = orbState[slot];
        st.charge  = Math.max(0, Math.min(1, st.charge + (open ? 0.06 : -0.18)));

        if (open && !st.wasOpen) {
          const v = orbs[slot];
          v.currentTime = 0;
          v.play().catch(err => console.warn('rasengan play failed', err));
        }
        st.wasOpen = open;

        if (st.charge > 0.01) placeOrb(slot, lm, st.charge);
        else orbs[slot].style.opacity = 0;
      });

      // Decay any hand we didn't see this frame.
      for (let i = 0; i < 2; i++) {
        if (seen[i]) continue;
        orbState[i].charge  = Math.max(0, orbState[i].charge - 0.18);
        orbState[i].wasOpen = false;
        orbs[i].style.opacity = orbState[i].charge.toFixed(3);
      }
    }

    const hands = new Hands({
      locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`
    });
    hands.setOptions({
      maxNumHands: 2,
      modelComplexity: 1,
      minDetectionConfidence: 0.65,
      minTrackingConfidence:  0.65
    });
    hands.onResults(onResults);

    const camera = new Camera(camVideo, {
      onFrame: async () => { await hands.send({ image: camVideo }); },
      width:  1280,
      height: 720
    });
    camera.start();
  </script>
</body>
</html>
