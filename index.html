<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ichara → Kalimat</title>
<style>
  :root { --bg:#0b1020; --card:#141b34; --line:#26305a; --txt:#e8ecff; --mut:#8c97c7; --acc:#5ad1ff; }
  * { box-sizing:border-box; }
  html,body { margin:0; min-height:100%; background:radial-gradient(1200px 600px at 20% -10%, #1b2658, var(--bg)); color:var(--txt); font-family:system-ui,-apple-system,"Segoe UI",sans-serif; }
  main { display:grid; grid-template-columns:1fr 1fr; gap:16px; padding:16px; max-width:1200px; margin:0 auto; }
  @media (max-width:820px){ main { grid-template-columns:1fr; } }
  .card { background:var(--card); border:1px solid var(--line); border-radius:20px; padding:14px; display:flex; flex-direction:column; gap:12px; }
  h2 { margin:0; font-size:15px; font-weight:600; color:var(--mut); letter-spacing:.04em; text-transform:uppercase; }
  .stage { position:relative; aspect-ratio:4/3; border-radius:14px; overflow:hidden; background:#000; }
  .stage video,.stage canvas { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; transform:scaleX(-1); }
  #msg { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; text-align:center; padding:20px; color:#fff; background:rgba(0,0,0,.55); font-size:15px; }
  #now { text-align:center; padding:6px 0 2px; }
  #emoji { font-size:92px; line-height:1.1; }
  #word { font-size:30px; font-weight:700; margin-top:4px; }
  #fr { color:var(--mut); font-size:15px; min-height:20px; }
  #letter { display:inline-block; margin-top:8px; padding:3px 12px; border-radius:99px; background:#1e2a55; color:var(--acc); font-weight:700; min-height:0; }
  #letter:empty { display:none; }
  .track { height:8px; background:#1e2850; border-radius:99px; overflow:hidden; }
  #bar { height:100%; width:0; background:linear-gradient(90deg,#5ad1ff,#8b7bff); transition:width .08s linear; }
  .hint { font-size:12px; color:var(--mut); margin-top:-6px; }
  #sentence { min-height:54px; padding:10px 12px; background:#0e1530; border:1px dashed var(--line); border-radius:12px; font-size:19px; }
  #sentence:empty::before { content:"Jomla dyalek ghadi tban hna…"; color:#59639a; }
  .row { display:flex; gap:8px; }
  button { flex:1; padding:10px; border-radius:12px; border:1px solid var(--line); background:#1b2450; color:var(--txt); font-size:14px; cursor:pointer; }
  button:hover { background:#25306a; }
  #legend { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:6px; }
  .chip { font-size:13px; padding:6px 8px; background:#0e1530; border:1px solid var(--line); border-radius:10px; }
</style>
</head>
<body>
<main>
  <section class="card">
    <h2>📷 Camera</h2>
    <div class="stage">
      <video id="v" playsinline muted></video>
      <canvas id="c"></canvas>
      <div id="msg">Kan7ell l-caméra… 9bel l-permission.</div>
    </div>
  </section>

  <section class="card">
    <h2>💬 Texte</h2>
    <div id="now">
      <div id="emoji">🤚</div>
      <div id="word">7ett ydek qoddam l-caméra</div>
      <div id="fr">Montre ta main à la caméra</div>
      <div id="letter"></div>
    </div>
    <div class="track"><div id="bar"></div></div>
    <div class="hint">Chd nfs l-ichara ~1 tanya bach tzaf f l-jomla.</div>
    <div id="sentence"></div>
    <div class="row">
      <button id="undo">⌫ Mse7 lkelma</button>
      <button id="clear">🗑️ Mse7 kolchi</button>
    </div>
    <h2>🖐️ Lichara li kan3rf</h2>
    <div id="legend"></div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
<script>
  const $ = id => document.getElementById(id);
  const v = $('v'), c = $('c'), g = c.getContext('2d');

  // e = emoji, l = lettre (optionnel), w = kelma b darija, f = français
  const SIGNS = {
    five:  { e:'🖐️', l:'5', w:'Salam',          f:'Bonjour / 5' },
    four:  { e:'🖖',  l:'B', w:'Rb3a',           f:'Quatre / lettre B' },
    three: { e:'3️⃣', l:'W', w:'Tlata',          f:'Trois / lettre W' },
    two:   { e:'✌️',  l:'V', w:'Joj',            f:'Deux / Paix / lettre V' },
    one:   { e:'☝️',  l:'D', w:'Wa7ed',          f:'Un / lettre D' },
    pinky: { e:'🤙',  l:'I', w:'Sghir',          f:'Petit / lettre I' },
    L:     { e:'👆',  l:'L', w:'Hna',            f:'Ici / lettre L' },
    call:  { e:'🤙',  l:'Y', w:'Sifet liya',     f:'Appelle-moi / lettre Y' },
    love:  { e:'🤟',        w:'Kan7ebbek',       f:'Je t’aime' },
    rock:  { e:'🤘',        w:'Mzyan bzzaf',     f:'Super / Rock' },
    ok:    { e:'👌',  l:'F', w:'OK, mzyan',      f:'D’accord / lettre F' },
    fist:  { e:'✊',  l:'A', w:'Wa9ef',          f:'Stop / lettre A' },
    up:    { e:'👍',        w:'Iyeh, mzyan',     f:'Oui / Bien' },
    down:  { e:'👎',        w:'La, machi mzyan', f:'Non / Pas bien' }
  };
  // thumb,index,middle,ring,pinky  (1 = étendu)
  const PAT = { '11111':'five','01111':'four','01110':'three','01100':'two','01000':'one',
                '00001':'pinky','11000':'L','10001':'call','11001':'love','01001':'rock','00000':'fist' };

  $('legend').innerHTML = Object.values(SIGNS)
    .map(s => `<div class="chip">${s.e} ${s.l ? '<b>' + s.l + '</b> · ' : ''}${s.w}</div>`).join('');

  function classify(lm) {
    const W = v.videoWidth, H = v.videoHeight;
    const d = (a, b) => Math.hypot((lm[a].x - lm[b].x) * W, (lm[a].y - lm[b].y) * H);
    const hs = d(0, 9);
    if (hs < 5) return null;
    const fingers = [[8,6],[12,10],[16,14],[20,18]].map(([t, p]) => d(t, 0) > d(p, 0) * 1.05);
    const thumb = d(4, 5) > hs * 0.6;
    if (d(4, 8) < hs * 0.3 && fingers[1] && fingers[2] && fingers[3]) return 'ok';
    const key = [thumb, ...fingers].map(b => +b).join('');
    if (key === '10000') {
      const dy = (lm[4].y - lm[0].y) * H;
      return dy < -hs * 0.8 ? 'up' : dy > hs * 0.8 ? 'down' : 'fist';
    }
    return PAT[key] || null;
  }

  // ---- affichage + jomla ----
  const sentence = [];
  let hist = [], cur = null, since = 0, armed = true;
  const bar = $('bar');

  function show(k) {
    const s = SIGNS[k];
    $('emoji').textContent  = s ? s.e : '🤚';
    $('word').textContent   = s ? s.w : 'Ma 3rftch had l-ichara';
    $('fr').textContent     = s ? s.f : 'Signe non reconnu';
    $('letter').textContent = s && s.l ? 'Lettre : ' + s.l : '';
  }
  function update(k) {
    hist.push(k); if (hist.length > 7) hist.shift();
    const counts = {};
    hist.forEach(x => counts[x] = (counts[x] || 0) + 1);
    const top = Object.keys(counts).sort((a, b) => counts[b] - counts[a])[0];
    const key = top === 'null' ? null : top;
    const now = performance.now();
    if (key !== cur) { cur = key; since = now; armed = true; show(key); }
    const p = key && armed ? Math.min(1, (now - since) / 1100) : 0;
    bar.style.width = (p * 100) + '%';
    if (p >= 1) { sentence.push(SIGNS[key].w.split(',')[0]); armed = false; render(); }
  }
  function render() { $('sentence').textContent = sentence.join('  ·  '); }
  $('undo').onclick  = () => { sentence.pop(); render(); };
  $('clear').onclick = () => { sentence.length = 0; render(); };

  // ---- MediaPipe ----
  const hands = new Hands({ locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}` });
  hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.6, minTrackingConfidence: 0.5 });
  hands.onResults(res => {
    c.width = v.videoWidth; c.height = v.videoHeight;
    g.clearRect(0, 0, c.width, c.height);
    const lm = res.multiHandLandmarks && res.multiHandLandmarks[0];
    if (!lm) { update(null); return; }
    g.lineWidth = 3; g.strokeStyle = '#5ad1ff'; g.fillStyle = '#fff';
    (window.HAND_CONNECTIONS || []).forEach(([a, b]) => {
      g.beginPath(); g.moveTo(lm[a].x * c.width, lm[a].y * c.height);
      g.lineTo(lm[b].x * c.width, lm[b].y * c.height); g.stroke();
    });
    lm.forEach(p => { g.beginPath(); g.arc(p.x * c.width, p.y * c.height, 4, 0, 7); g.fill(); });
    update(classify(lm));
  });

  async function start() {
    try {
      v.srcObject = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: 1280, height: 720 }, audio: false });
      await v.play();
      $('msg').remove();
      (async function loop() {
        if (v.readyState >= 2) await hands.send({ image: v });
        requestAnimationFrame(loop);
      })();
    } catch (e) {
      $('msg').textContent = 'L-caméra ma tbdatch. Fte7 had l-page mn http://localhost wla https:// w 9bel l-permission. (' + e.name + ')';
    }
  }
  start();
</script>
</body>
</html>
